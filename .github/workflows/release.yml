name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install builder
        run: python -m pip install -r scripts/requirements-build.lock.txt
      - name: Build and test
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'El tag debe coincidir con package.json.' }
          ./scripts/build-release.ps1 -Version $version
      - name: Publish tagged release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'La release ya existe; no se sustituyen sus archivos.'; exit 0 }
          gh release create $tag "release/Diario-de-Cvstodia-$version-windows-x64.zip" release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Diario de Cvstodia $version · Windows portátil" --notes-file RELEASE_NOTES.md
